<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="GreenER: monitoramento de serviços e impacto ambiental."
    />
    <title>GreenER</title>
  </head>
  <body>
    <script>
      (function () {
        try {
          var destino = window.sessionStorage.getItem('greener-spa-redirect');
          if (destino) {
            window.sessionStorage.removeItem('greener-spa-redirect');
            if (destino.startsWith('/') && !destino.startsWith('//')) {
              window.history.replaceState(null, '', destino);
            }
          }
        } catch (erro) {
          // Ignora indisponibilidade de sessionStorage
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
